# Render Blueprint: New + > Blueprint > pick this repo. Render asks for every value marked "sync: false".
services:
  - type: web
    name: buono-cafe
    runtime: node
    region: ohio # same region as the Neon database (us-east-2): fastest queries
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent
      - key: ALLOW_DEV_AUTH
        value: "false"
      # the admin dashboard (Vercel) calls this API from the internet; it is protected by ADMIN_PASSWORD + JWT
      - key: ADMIN_LOCAL_ONLY
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD # at least 12 characters
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL # Mini App URL on Vercel, e.g. https://buono-cafe.vercel.app
        sync: false
      - key: CORS_ORIGINS # comma separated: Mini App + admin URLs on Vercel
        sync: false
